<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cytoscape Graph</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #cy {
      width: 100%; height: 100%;
      background: #000000;
      border-radius: 20px;
      border: 1px solid rgba(234, 239, 247, 0.07);
      box-sizing: border-box;
    }

    /* ── Tooltip ───────────────────────────────────────────────────────── */
    #tooltip {
      position: absolute;
      top: 0; left: 0;
      background: rgba(7, 10, 18, 0.94);
      border: 1px solid rgba(234, 239, 247, 0.14);
      border-radius: 12px;
      padding: 10px 14px;
      pointer-events: none;
      display: none;
      z-index: 200;
      min-width: 150px;
      max-width: 220px;
      box-shadow: 0 6px 28px rgba(0, 0, 0, 0.65);
    }
    .tt-name  { font-weight: 700; font-size: 13px; color: #EAEFF7; margin-bottom: 3px; }
    .tt-area  { font-size: 10.5px; color: #7DD3FC; letter-spacing: 0.03em; margin-bottom: 1px; }
    .tt-band  { font-size: 10px; color: #4B5563; margin-bottom: 5px; }
    .tt-row   { display: flex; justify-content: space-between; align-items: center;
                font-size: 10.5px; color: #9AA4B2; margin-bottom: 5px; }
    .tt-mastery-val { font-weight: 700; }
    .tt-bar   { width: 100%; height: 3px; background: #1E2535; border-radius: 2px; }
    .tt-fill  { height: 100%; border-radius: 2px; transition: width 0.3s; }
  </style>
</head>
<body>
  <div id="cy"></div>
  <div id="tooltip">
    <div class="tt-name" id="tt-name"></div>
    <div class="tt-area" id="tt-area"></div>
    <div class="tt-band" id="tt-band"></div>
    <div class="tt-row">
      <span>Mastery</span>
      <span class="tt-mastery-val" id="tt-mastery-val">—</span>
    </div>
    <div class="tt-bar"><div class="tt-fill" id="tt-fill"></div></div>
  </div>

  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <script>
    // ── Streamlit bridge ────────────────────────────────────────────────────
    const Streamlit = {
      setComponentReady() {
        window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
      },
      setFrameHeight(h) {
        window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h }, "*");
      },
      setComponentValue(v) {
        window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue", value: v }, "*");
      },
      onRender(cb) {
        window.addEventListener("message", e => {
          if (e.data && e.data.type === "streamlit:render") cb({ args: e.data.args || {} });
        });
      }
    };

    // ── State ───────────────────────────────────────────────────────────────
    let cy = null;
    let pulseRunning = false;
    let pulseGeneration = 0;
    let mouseX = 0, mouseY = 0;

    const tooltip = document.getElementById('tooltip');
    const ttName  = document.getElementById('tt-name');
    const ttArea  = document.getElementById('tt-area');
    const ttBand  = document.getElementById('tt-band');
    const ttMval  = document.getElementById('tt-mastery-val');
    const ttFill  = document.getElementById('tt-fill');

    // Track cursor position relative to the cy container
    document.getElementById('cy').addEventListener('mousemove', e => {
      const r = e.currentTarget.getBoundingClientRect();
      mouseX = e.clientX - r.left;
      mouseY = e.clientY - r.top;
      if (tooltip.style.display !== 'none') positionTooltip();
    });

    function positionTooltip() {
      const W = document.getElementById('cy').offsetWidth;
      const H = document.getElementById('cy').offsetHeight;
      const tw = tooltip.offsetWidth  || 180;
      const th = tooltip.offsetHeight || 90;
      let lx = mouseX + 16;
      let ly = mouseY - th - 10;
      if (lx + tw > W - 8) lx = mouseX - tw - 12;
      if (ly < 8) ly = mouseY + 20;
      tooltip.style.left = lx + 'px';
      tooltip.style.top  = ly + 'px';
    }

    function showTooltip(d) {
      ttName.textContent = d.label || d.id || '';
      ttArea.textContent = d.area  || '';
      ttBand.textContent = (d.levelBand || '').replace(/_/g, ' ');
      const m = typeof d.mastery === 'number' ? d.mastery : 0;
      const pct = Math.round(m * 100);
      ttMval.textContent = pct + '%';
      ttMval.style.color = m >= 0.70 ? '#8DE4AF' : m >= 0.40 ? '#F6D06F' : '#FF6B6B';
      ttFill.style.width = pct + '%';
      ttFill.style.background = m >= 0.70 ? '#8DE4AF' : m >= 0.40 ? '#F6D06F' : '#FF6B6B';
      tooltip.style.display = 'block';
      positionTooltip();
    }

    function hideTooltip() { tooltip.style.display = 'none'; }

    // ── Pulse animation on selected node ───────────────────────────────────
    function stopPulse() {
      pulseRunning = false;
      pulseGeneration++;
    }

    function startPulse(keyNode) {
      stopPulse();
      if (!keyNode || !keyNode.length) return;
      pulseRunning = true;
      const gen = ++pulseGeneration;

      let expanding = true;
      const tick = () => {
        if (!pulseRunning || pulseGeneration !== gen || !cy) return;
        if (!keyNode.inside()) return;
        if (expanding) {
          keyNode.animate({ style: { 'border-width': 10, 'border-opacity': 0.18 } },
            { duration: 920, complete: () => { expanding = false; tick(); } });
        } else {
          keyNode.animate({ style: { 'border-width': 3,  'border-opacity': 1.0  } },
            { duration: 780, complete: () => { expanding = true;  tick(); } });
        }
      };
      setTimeout(tick, 250);
    }

    // ── Edge opacity by zoom ───────────────────────────────────────────────
    function edgeOpacityForZoom(zoom) {
      if (zoom >= 0.50) return 0.40;
      if (zoom >= 0.28) return 0.22;
      if (zoom >= 0.13) return 0.10;
      return 0.0;
    }

    function applyBaseEdgeOpacity() {
      if (!cy) return;
      const op = edgeOpacityForZoom(cy.zoom());
      cy.edges().not('.hover-edge, .key-edge').style('opacity', op);
    }

    // ── Key-edge highlight ─────────────────────────────────────────────────
    function applyKeyEdges() {
      if (!cy) return;
      cy.edges().removeClass('key-edge');
      const keyNode = cy.nodes('.key');
      if (keyNode.length) {
        keyNode.connectedEdges().addClass('key-edge');
        startPulse(keyNode);
      }
    }

    // ── Main render ────────────────────────────────────────────────────────
    function renderGraph(data) {
      stopPulse();
      hideTooltip();
      if (cy) { cy.destroy(); cy = null; }

      const args      = data.args || {};
      const nodes     = args.nodes  || [];
      const edges     = args.edges  || [];
      const height    = args.height || 720;
      const focusId   = args.focusNodeId;
      const focusZoom = args.focusZoom || 1.1;

      document.getElementById('cy').style.height = `${height}px`;

      cy = cytoscape({
        container: document.getElementById('cy'),
        elements: { nodes, edges },

        style: [
          // ── Base node ───────────────────────────────────────────────────
          {
            selector: 'node',
            style: {
              'shape':               'ellipse',
              'background-color':    'data(color)',
              'background-opacity':  0.80,
              'border-width':        0,
              'border-opacity':      0,
              'width':               'data(size)',
              'height':              'data(size)',
              'label':               'data(label)',
              'font-size':           10,
              'font-weight':         700,
              'color':               '#FFFFFF',
              'text-valign':         'center',
              'text-halign':         'center',
              'text-wrap':           'wrap',
              'text-max-width':      80,
              // No text background — white text reads fine against coloured fill.
              'text-background-opacity': 0,
              'text-opacity':        0,
              'shadow-blur':         0,
              'shadow-color':        '#000000',
              'shadow-offset-x':     0,
              'shadow-offset-y':     0,
              'shadow-opacity':      0,
              'transition-property': 'background-color, background-opacity, border-width, border-color, border-opacity, opacity, shadow-blur, shadow-opacity',
              'transition-duration': '0.22s',
              'transition-timing-function': 'ease-in-out',
              'z-index':             2,
            },
          },
          // ── Selected (key) node ─────────────────────────────────────────
          {
            selector: 'node.key',
            style: {
              'background-color':    '#00E5FF',
              'background-opacity':  1.0,
              'border-width':        3,
              'border-color':        '#FFFFFF',
              'border-opacity':      1.0,
              'shadow-blur':         24,
              'shadow-color':        '#00E5FF',
              'shadow-offset-x':     0,
              'shadow-offset-y':     0,
              'shadow-opacity':      0.80,
              'color':               '#000000',
              'text-opacity':        1,
              'text-background-opacity': 0,
              'z-index':             14,
            },
          },
          // ── Related / highlighted neighbours ────────────────────────────
          {
            selector: 'node.highlighted',
            style: {
              'background-color':    '#7CFFB2',
              'background-opacity':  0.92,
              'border-width':        1.5,
              'border-color':        '#7CFFB2',
              'border-opacity':      0.55,
              'shadow-blur':         12,
              'shadow-color':        '#7CFFB2',
              'shadow-offset-x':     0,
              'shadow-offset-y':     0,
              'shadow-opacity':      0.40,
              'color':               '#001a0d',
              'text-opacity':        1,
              'text-background-opacity': 0,
              'z-index':             8,
            },
          },
          // ── Hovered node ────────────────────────────────────────────────
          {
            selector: 'node.hovered',
            style: {
              'background-opacity':  1.0,
              'border-width':        2,
              'border-color':        '#EAEFF7',
              'border-opacity':      0.65,
              'shadow-blur':         12,
              'shadow-color':        'data(color)',
              'shadow-offset-x':     0,
              'shadow-offset-y':     0,
              'shadow-opacity':      0.55,
              'color':               '#FFFFFF',
              'text-opacity':        1,
              'text-background-opacity': 0,
              'z-index':             10,
            },
          },
          // ── Dimmed (inactive) nodes ─────────────────────────────────────
          {
            selector: 'node.dimmed',
            style: {
              'background-color':   '#2A2E39',
              'background-opacity': 0.28,
              'text-opacity':       0,
              'border-width':       0,
              'shadow-blur':        0,
              'shadow-opacity':     0,
              'z-index':            1,
            },
          },
          // ── Route nodes (not selected / dimmed) ─────────────────────────
          {
            selector: 'node.route:not(.dimmed):not(.key):not(.highlighted)',
            style: {
              'border-width':   1.5,
              'border-color':   '#9AA4B2',
              'border-opacity': 0.42,
            },
          },

          // ── Default edge ────────────────────────────────────────────────
          {
            selector: 'edge',
            style: {
              'opacity':              0,
              'width':                1,
              'line-color':           '#2B3445',
              'target-arrow-color':   '#2B3445',
              'target-arrow-shape':   'triangle',
              'arrow-scale':          0.6,
              'curve-style':          'bezier',
              'transition-property':  'opacity, width, line-color',
              'transition-duration':  '0.22s',
              'transition-timing-function': 'ease-in-out',
            },
          },
          // ── Hover edge ──────────────────────────────────────────────────
          {
            selector: 'edge.hover-edge',
            style: {
              'opacity':            0.75,
              'width':              1.5,
              'line-color':         '#7DD3FC',
              'target-arrow-color': '#7DD3FC',
              'z-index':            5,
            },
          },
          // ── Key-node edges ──────────────────────────────────────────────
          {
            selector: 'edge.key-edge',
            style: {
              'opacity':            0.88,
              'width':              2,
              'line-color':         '#00E5FF',
              'target-arrow-color': '#00E5FF',
              'z-index':            6,
            },
          },
        ],

        layout: { name: 'preset', fit: true, padding: 32 },
        autoungrabify: true,
        userZoomingEnabled: true,
        userPanningEnabled: true,
        minZoom: 0.04,
        maxZoom: 4.0,
      });

      applyKeyEdges();

      if (focusId) {
        const node = cy.getElementById(focusId);
        if (node && node.length) {
          cy.zoom({ level: focusZoom, renderedPosition: node.renderedPosition() });
          cy.center(node);
        }
      }

      // ── Zoom: update label visibility + edge opacity ─────────────────────
      cy.on('zoom', () => {
        const z = cy.zoom();
        cy.nodes().not('.key, .hovered, .highlighted').style('text-opacity', z >= 0.38 ? 1 : 0);
        applyBaseEdgeOpacity();
      });

      // ── Mouse-over node ──────────────────────────────────────────────────
      cy.on('mouseover', 'node', evt => {
        const n = evt.target;
        showTooltip(n.data());

        if (n.hasClass('key')) return;   // don't alter dimming when hovering selected

        n.addClass('hovered');
        n.connectedEdges().connectedNodes().not(n).forEach(o => {
          if (!o.hasClass('key')) o.addClass('highlighted');
        });
        cy.nodes().not(n).not('.highlighted').not('.key').addClass('dimmed');
        cy.edges().removeClass('hover-edge');
        n.connectedEdges().not('.key-edge').addClass('hover-edge');
      });

      cy.on('mouseout', 'node', () => {
        cy.nodes().removeClass('hovered highlighted dimmed');
        cy.edges().removeClass('hover-edge');
        applyBaseEdgeOpacity();
        hideTooltip();
      });

      // ── Click: select skill ──────────────────────────────────────────────
      cy.on('tap', 'node', evt => {
        Streamlit.setComponentValue(evt.target.id());
      });

      Streamlit.setFrameHeight(height + 8);
    }

    Streamlit.setComponentReady();
    Streamlit.onRender(renderGraph);
  </script>
</body>
</html>
